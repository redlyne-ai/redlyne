name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  parity:
    name: Parity tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Python engine is fully portable — run on all three majors.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Engine smoke test (loads all rules cleanly)
        run: |
          python -c "import sys; sys.path.insert(0, 'launch_tool'); from redlyne_engine import load_rules, RULES_DIR; rules, errors = load_rules(RULES_DIR, verbose=False); assert len(errors) == 0, f'rule load errors: {errors}'; print(f'OK: {len(rules)} rules loaded')"

      - name: Run parity tests on Python engine
        run: pytest tests/test_python_engine.py -v --tb=short
        timeout-minutes: 5

  benchmark:
    name: Benchmark (recall + patch safety)
    runs-on: ubuntu-latest
    # Run benchmarks only on push to main (skipped on PRs to keep them fast)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: parity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Bench against committed baseline
        # The two bench scripts walk the dataset/ directory at runtime;
        # since dataset/ is gitignored (large external benchmarks), this
        # step only verifies the harness runs end-to-end against the
        # in-repo fixtures + the reproducible PoisonPy/SecurityEval/Copilot
        # bench will only emit per-CWE numbers when the user has the
        # datasets cloned locally. CI just sanity-checks the harness.
        run: |
          # Smoke run — no dataset/ in CI, expected output is empty sections
          # but harness must not crash
          python tests/bench_dataset.py --securityeval || true
          python tests/bench_patching.py --no-poisonpy || true

      - name: Show baseline metrics from committed snapshots
        run: |
          echo "=== Detection baseline ==="
          cat benchmarks/dataset_results/baseline_v0.1.0.md | head -30
          echo
          echo "=== Patching baseline ==="
          cat benchmarks/patching_results/baseline_v0.1.0.md | head -30
