name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  parity:
    name: Parity tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux first (canonical). macOS for the Mac dev experience.
        # Windows runners use WSL via the bash engine, so the bash path needs
        # to be wrapped — for now we only validate on Linux/macOS in CI and
        # leave Windows as a manual smoke check.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OS dependencies
        # The legacy bash engine relies on jq for JSON manipulation
        # in some pipelines. Install it where missing.
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y jq bash
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install jq
          fi
        shell: bash

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Make engine scripts executable
        run: chmod +x launch_tool/*.sh

      - name: Run sanity tests (no engine invocation)
        run: |
          pytest tests/test_parity.py::test_no_orphan_golden_files \
                 tests/test_parity.py::test_no_missing_golden_files -v

      - name: Run full parity suite (engine invoked per fixture)
        # The bash engine is currently slow (~15-20s per fixture).
        # We accept this for now; this job is the safety net during refactor.
        run: pytest tests/test_parity.py -v --tb=short
        timeout-minutes: 15

  benchmark:
    name: Performance benchmark (Linux only)
    runs-on: ubuntu-latest
    # Benchmarks run only on push to main, not on every PR (too slow + noisy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: parity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OS dependencies
        run: sudo apt-get update && sudo apt-get install -y jq bash

      - name: Install Python dependencies
        run: pip install pytest

      - name: Make engine scripts executable
        run: chmod +x launch_tool/*.sh

      - name: Run benchmark
        run: python tests/benchmark.py
        timeout-minutes: 20

      - name: Upload benchmark snapshot
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.sha }}
          path: benchmarks/results/
          retention-days: 90
